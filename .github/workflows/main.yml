name: Update IPTV List

on:
  schedule:
    - cron: "0 3 * * *"  # Her gün sabah 03:00
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Reposu klonla
        uses: actions/checkout@v4

      - name: Python ortamını ayarla
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Gerekli paketleri kur
        run: |
          pip install requests

      - name: Favori listesi güncelle
        env:
          GIST_ID_LINKS: ${{ secrets.GIST_ID_LINKS }}
          GIST_ID_OUTPUT: ${{ secrets.GIST_ID_OUTPUT }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python - <<'PYCODE'
          import requests, re, os

          gist_api = "https://api.github.com/gists/"
          token = os.getenv("GH_TOKEN")
          headers = {"Authorization": f"token {token}"} if token else {}

          def get_gist_content(gid):
              r = requests.get(gist_api + gid, headers=headers)
              r.raise_for_status()
              return list(r.json()["files"].values())[0]["content"]

          def update_gist(gid, content):
              r = requests.patch(gist_api + gid, headers=headers, json={"files": {"favoritv": {"content": content}}})
              r.raise_for_status()

          # Gist ve filtreleri al
          try:
              links_raw = get_gist_content(os.getenv("GIST_ID_LINKS"))
          except Exception as e:
              print("❌ Link listesi alınamadı:", e)
              raise SystemExit(1)

          links = [l.strip() for l in links_raw.splitlines() if l.strip()]
          try:
              with open("filter.txt", "r", encoding="utf-8") as f:
                  filters = [x.strip().lower() for x in f if x.strip()]
          except:
              filters = []

          total_channels = 0
          skipped = 0
          epg_line = None
          combined = []

          print(f"🔄 {len(links)} bağlantı işlenecek...")

          for i, line in enumerate(links):
              parts = re.findall(r"#(.*?)#", line)
              url = re.sub(r"#.*?#", "", line).strip()
              category = parts[0] if parts else None
              all_flag = any(p.lower() == "all" for p in parts)

              try:
                  data = requests.get(url, timeout=20).text
              except Exception:
                  skipped += 1
                  continue

              if i == 0:
                  m = re.search(r'(?m)^#EXTM3U[^\n]*', data)
                  if m:
                      epg_line = m.group(0)

              lines = [l for l in data.splitlines() if not l.strip().startswith("#EXTM3U")]

              for j in range(len(lines)):
                  if lines[j].startswith("#EXTINF"):
                      infoline = lines[j]
                      url_line = lines[j + 1] if j + 1 < len(lines) else ""

                      match = re.search(r",\s*(.*)", infoline)
                      name = match.group(1).lower() if match else ""

                      if all_flag or any(re.search(rf'\b{re.escape(f)}\b', name, re.IGNORECASE) for f in filters):
                          infoline = re.sub(r'(group-title|tvg-group)="[^"]*"', '', infoline)
                          if category:
                              infoline = infoline.replace("#EXTINF", f'#EXTINF:-1 group-title="{category}"')
                          combined.append(infoline)
                          combined.append(url_line)
                          total_channels += 1

          output = (epg_line + "\n" if epg_line else "#EXTM3U\n") + "\n".join(combined)

          try:
              update_gist(os.getenv("GIST_ID_OUTPUT"), output)
              print(f"✅ Güncelleme tamamlandı: {total_channels} kanal, {skipped} hatalı bağlantı.")
          except Exception as e:
              print("❌ Gist güncellenemedi:", e)
          PYCODE
