name: Günlük IPTV Güncelleme (favoritv Gist)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerekli kütüphaneler
        run: pip install requests

      - name: IPTV Listesini Güncelle (favoritv)
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PYCODE'
          import os, requests, re

          gist_id = os.environ.get("GIST_ID")
          github_token = os.environ.get("GITHUB_TOKEN")

          if not gist_id or not github_token:
              print("❌ GIST_ID veya GITHUB_TOKEN eksik.")
              raise SystemExit(1)

          headers = {"Authorization": f"token {github_token}"}
          gist_api = f"https://api.github.com/gists/{gist_id}"

          # Gist'i al
          resp = requests.get(gist_api, headers=headers)
          if resp.status_code != 200:
              print(f"Gist alınamadı: {resp.status_code}")
              raise SystemExit(1)

          gist_data = resp.json()
          files = gist_data.get("files", {})

          if "links" not in files:
              print("❌ 'links' dosyası bulunamadı.")
              raise SystemExit(1)

          links_content = files["links"]["content"]
          all_links = [line.strip() for line in links_content.splitlines() if line.strip()]
          print(f"{len(all_links)} bağlantı bulundu.")

          # filter.txt oku (repo kökünde)
          try:
              with open("filter.txt", "r", encoding="utf-8") as f:
                  favorite_channels = [line.strip() for line in f if line.strip()]
          except Exception as e:
              print(f"❌ filter.txt okunamadı: {e}")
              favorite_channels = []

          combined = "#EXTM3U\n"

          for line in all_links:
              parts = [p for p in line.split('#') if p]
              category = None
              take_all = False
              actual_link = None

              if parts:
                  if len(parts) == 3:  # kategori#all#URL
                      category = parts[0]
                      if parts[1].lower() == "all":
                          take_all = True
                      actual_link = parts[2]
                  elif len(parts) == 2:  # kategori#URL
                      category = parts[0]
                      actual_link = parts[1]
              else:
                  actual_link = line

              actual_link = actual_link.strip()
              if not actual_link.startswith("http"):
                  print(f"⚠️ Geçersiz URL atlandı: {actual_link}")
                  continue

              try:
                  r = requests.get(actual_link, timeout=20)
                  if r.status_code != 200:
                      print(f"⚠️ {actual_link} hata: {r.status_code}")
                      continue

                  content_lines = r.text.splitlines()
                  for cl in content_lines:
                      cl = cl.strip()
                      if not cl:
                          continue

                      if cl.startswith("#EXTINF"):
                          if take_all or any(name in cl for name in favorite_channels):
                              if category:
                                  if 'tvg-group="' in cl:
                                      cl = re.sub(r'tvg-group="[^"]*"', f'tvg-group="{category}"', cl)
                                  else:
                                      cl = cl.replace("#EXTINF:", f'#EXTINF: tvg-group="{category}" ', 1)
                              combined += cl + "\n"
                      else:
                          if take_all or any(name in cl for name in favorite_channels):
                              combined += cl + "\n"

                  print(f"✅ {actual_link} işlendi. (kategori={category}, all={take_all})")

              except Exception as e:
                  print(f"⚠️ {actual_link} indirilemedi: {e}")

          # Gist güncelle
          update_payload = {"files": {"favoritv": {"content": combined}}}
          update_resp = requests.patch(gist_api, headers=headers, json=update_payload)

          if update_resp.status_code == 200:
              print("🎉 favoritv listesi başarıyla güncellendi.")
          else:
              print(f"❌ Gist güncellenemedi: {update_resp.status_code}, {update_resp.text}")
          PYCODE
