name: Günlük IPTV Güncelleme (favoritv)

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerekli paketler
        run: |
          pip install requests

      - name: IPTV listesini güncelle
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python <<'PYCODE'
          import os, requests, re

          gist_id = os.environ.get("GIST_ID")
          github_token = os.environ.get("GITHUB_TOKEN")

          headers = {"Authorization": f"token {github_token}"}
          gist_api = f"https://api.github.com/gists/{gist_id}"

          # --- GIST AL ---
          resp = requests.get(gist_api, headers=headers)
          gist_data = resp.json()
          links_file = gist_data["files"].get("links")
          if not links_file:
              raise SystemExit(1)

          all_links = [l.strip() for l in links_file["content"].splitlines() if l.strip()]

          # --- FILTER.TXT OKU (Sıralama Duyarlı) ---
          filters = {}
          ordered_keywords = [] # Kanalların çıkış sırasını belirleyecek ana liste
          with open("filter.txt", "r", encoding="utf-8") as f:
              current_cat = None
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"): continue
                  if line.startswith("[") and line.endswith("]"):
                      current_cat = line[1:-1]
                      filters[current_cat] = []
                  else:
                      keywords = [x.strip() for x in line.split(",") if x.strip()]
                      filters[current_cat].extend(keywords)
                      ordered_keywords.extend([(kw, current_cat) for kw in keywords])

          # --- YARDIMCI FONKSİYONLAR ---
          def extract_name(extinf):
              parts = extinf.split(",", 1)
              return parts[1].lower() if len(parts) == 2 else ""

          def keyword_match(display_name, keyword):
              # REGEX: Kelimeyi isim içinde tam isabetle arar
              pattern = re.compile(re.escape(keyword.lower()))
              return bool(pattern.search(display_name))

          # --- VERİ TOPLAMA ---
          epg_line = None
          raw_content = ""
          # Anahtar kelimeye göre kanalları biriktir: {(keyword, cat): "kanallar..."}
          keyword_buckets = {item: "" for item in ordered_keywords}

          for idx, link in enumerate(all_links):
              raw_mode = link.lower().startswith("all#")
              actual = link[4:] if raw_mode else link
              if not actual.startswith("http"): continue

              try:
                  r = requests.get(actual, timeout=60)
                  r.encoding = 'utf-8'
                  lines = r.text.splitlines()

                  if idx == 0 and epg_line is None:
                      for l in lines:
                          if l.strip().upper().startswith("#EXTM3U"):
                              epg_line = l.strip()
                              break

                  if raw_mode:
                      for l in lines:
                          if l.strip().upper().startswith("#EXTM3U"): continue
                          raw_content += l.strip() + "\n"
                      continue

                  i = 0
                  while i < len(lines):
                      line = lines[i].strip()
                      if line.startswith("#EXTINF"):
                          display = extract_name(line)
                          url = lines[i+1].strip() if i+1 < len(lines) else ""
                          
                          if url and not url.startswith("#"):
                              # Kelime sırasına göre tara
                              for (kw, cat) in ordered_keywords:
                                  if keyword_match(display, kw):
                                      clean = re.sub(r'(group-title|tvg-group)="[^"]*"', '', line)
                                      final = clean.replace("#EXTINF:", f'#EXTINF: group-title="{cat}" ', 1)
                                      keyword_buckets[(kw, cat)] += final + "\n" + url + "\n"
                                      break # İlk eşleştiği kelimeye girsin
                          i += 2
                      else:
                          i += 1
              except: continue

          # --- SIRALI BİRLEŞTİRME ---
          final_body = raw_content
          # filter.txt'deki kelime sırasına göre havuzları boşalt
          for item in ordered_keywords:
              final_body += keyword_buckets[item]

          final_output = (epg_line + "\n" if epg_line else "#EXTM3U\n") + final_body

          # --- GIST GÜNCELLE ---
          payload = {"files": {"favoritv": {"content": final_output}}}
          requests.patch(gist_api, headers=headers, json=payload)
          print("🎉 Kanal sırasına göre Gist güncellendi.")
          PYCODE
