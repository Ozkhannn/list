name: Günlük IPTV Güncelleme (favoritv Gist)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Update favoritv list
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PYCODE'
          import os, requests, re

          gist_id = os.environ.get("GIST_ID")
          github_token = os.environ.get("GITHUB_TOKEN")

          if not gist_id or not github_token:
              print("❌ GIST_ID veya GITHUB_TOKEN eksik.")
              raise SystemExit(1)

          headers = {"Authorization": f"token {github_token}"}
          gist_api = f"https://api.github.com/gists/{gist_id}"

          # Gist link listesini al
          resp = requests.get(gist_api, headers=headers)
          if resp.status_code != 200:
              print(f"❌ Gist alınamadı: {resp.status_code}")
              raise SystemExit(1)

          gist_data = resp.json()
          files = gist_data.get("files", {})

          if "links" not in files:
              print("❌ 'links' dosyası bulunamadı.")
              raise SystemExit(1)

          links_content = files["links"]["content"]
          all_links = [line.strip() for line in links_content.splitlines() if line.strip()]
          print(f"🔗 {len(all_links)} bağlantı bulundu.")

          # ---------------------------------------------------
          # 📌 Yeni filter.txt parser
          # ---------------------------------------------------
          def load_categories():
              categories = {}
              current = None

              try:
                  with open("filter.txt", "r", encoding="utf-8") as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue

                          if line.startswith("[") and line.endswith("]"):
                              current = line[1:-1].strip()
                              categories[current] = []
                          else:
                              if current:
                                  terms = [t.strip().lower() for t in line.split(",") if t.strip()]
                                  categories[current].extend(terms)

                  print(f"🎯 {len(categories)} kategori yüklendi.")
              except Exception as e:
                  print(f"⚠️ filter.txt okunamadı: {e}")

              return categories

          categories = load_categories()

          # ---------------------------------------------------

          combined = ""
          epg_line = None

          def extract_display_name(extinf_line):
              parts = extinf_line.split(',', 1)
              return parts[1].strip() if len(parts) == 2 else ""

          # Kanalı kategori listeleriyle eşleştir
          def match_categories(display_name):
              dn = display_name.lower()
              matched = []

              for cat, terms in categories.items():
                  for term in terms:
                      if term in dn:  # kelime yer alıyorsa yeterli
                          matched.append(cat)
                          break

              return matched

          for idx, link in enumerate(all_links):
              parts = [p for p in link.split('#') if p]
              base_cat, take_all, actual_link = None, False, None

              if len(parts) == 3:
                  base_cat = parts[0]
                  take_all = parts[1].lower() == "all"
                  actual_link = parts[2]
              elif len(parts) == 2:
                  base_cat, actual_link = parts
              else:
                  actual_link = link

              if not actual_link.startswith("http"):
                  print(f"⚠️ Geçersiz URL: {actual_link}")
                  continue

              try:
                  r = requests.get(actual_link, timeout=60)
                  if r.status_code != 200:
                      print(f"⚠️ {actual_link} hata: {r.status_code}")
                      continue

                  lines = r.text.splitlines()

                  # İlk listeden EPG çek
                  if idx == 0 and epg_line is None:
                      for L in lines:
                          s = L.strip()
                          if s.upper().startswith("#EXTM3U"):
                              epg_line = s
                              break

                  for i, line in enumerate(lines):
                      line = line.strip()
                      if not line:
                          continue

                      if line.upper().startswith("#EXTM3U"):
                          continue

                      if not line.startswith("#EXTINF"):
                          continue

                      name = extract_display_name(line)

                      # ALL etiketi varsa filtre uygulanmasın
                      if not take_all:
                          matched_cats = match_categories(name)
                          if not matched_cats:
                              continue
                      else:
                          matched_cats = [base_cat] if base_cat else []

                      # Orijinal grup etiketlerini sil
                      line = re.sub(r'group-title="[^"]*"', '', line)
                      line = re.sub(r'tvg-group="[^"]*"', '', line)

                      # Birden fazla kategori olabilir
                      cats_to_add = matched_cats if matched_cats else ([base_cat] if base_cat else [])

                      for cat in cats_to_add:
                          new_line = line.replace(
                              "#EXTINF:",
                              f'#EXTINF: group-title="{cat}" ',
                              1
                          )
                          combined += new_line + "\n"

                          # Alt satırdaki URL ekle
                          if i + 1 < len(lines):
                              url_line = lines[i + 1].strip()
                              if url_line and not url_line.startswith("#"):
                                  combined += url_line + "\n"

                  print(f"✅ {actual_link} işlendi. ({'ALL' if take_all else 'Filtreli'})")

              except Exception as e:
                  print(f"⚠️ {actual_link} indirilemedi: {e}")

          final_output = (epg_line + "\n" if epg_line else "#EXTM3U\n") + combined

          update_payload = {"files": {"favoritv": {"content": final_output}}}
          update_resp = requests.patch(gist_api, headers=headers, json=update_payload)

          if update_resp.status_code == 200:
              print("🎉 favoritv listesi güncellendi.")
          else:
              print(f"❌ Güncellenemedi: {update_resp.status_code} {update_resp.text}")
          PYCODE
