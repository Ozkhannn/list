name: Günlük IPTV Güncelleme (favoritv Gist)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Update favoritv list
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PYCODE'
          import os, requests, re, yaml

          gist_id = os.environ.get("GIST_ID")
          github_token = os.environ.get("GITHUB_TOKEN")

          headers = {"Authorization": f"token {github_token}"}
          gist_api = f"https://api.github.com/gists/{gist_id}"

          # --- GIST AL ---
          resp = requests.get(gist_api, headers=headers)
          gist_data = resp.json()
          links_file = gist_data["files"].get("links")

          if not links_file:
              print("❌ 'links' dosyası bulunamadı.")
              raise SystemExit(1)

          all_links = [l.strip() for l in links_file["content"].splitlines() if l.strip()]
          print(f"🔗 {len(all_links)} bağlantı bulundu.")

          # --- FILTER.TXT OKU ---
          filters = {}
          try:
              with open("filter.txt", "r", encoding="utf-8") as f:
                  raw = f.read()

              current_category = None
              for line in raw.splitlines():
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("[") and line.endswith("]"):
                      current_category = line[1:-1].strip()
                      filters[current_category] = []
                  else:
                      if current_category:
                          filters[current_category] = [x.strip() for x in line.split(",") if x.strip()]
              print(f"📁 {len(filters)} kategori yüklendi.")
          except Exception as e:
              print(f"⚠️ filter.txt okunamadı: {e}")
              filters = {}

          # --- Fonksiyon: Display Name ---
          def extract_name(extinf):
              parts = extinf.split(",", 1)
              return parts[1].strip().lower() if len(parts) == 2 else ""

          # --- Fonksiyon: Tam Kelime Eşleşmesi ---
          def keyword_match(display_name, keyword):
              dn = display_name.lower()
              kw = keyword.lower()

              cleaned = re.sub(r'[^a-z0-9çğıöşü\s]', ' ', dn)
              cleaned = re.sub(r'\s+', ' ', cleaned).strip()

              words = cleaned.split()
              return kw in words

          # --- Başlangıç ---
          epg_line = None
          combined = ""

          for idx, link in enumerate(all_links):
              parts = [p for p in link.split('#') if p]
              category = None
              take_all = False

              if len(parts) == 3:
                  category = parts[0]
                  take_all = parts[1].lower() == "all"
                  actual = parts[2]
              elif len(parts) == 2:
                  category = parts[0]
                  actual = parts[1]
              else:
                  actual = link

              if not actual.startswith("http"):
                  continue

              try:
                  r = requests.get(actual, timeout=60)
                  lines = r.text.splitlines()

                  # EPG satırı (sadece ilk listeden)
                  if idx == 0 and epg_line is None:
                      for L in lines:
                          s = L.strip()
                          if s.upper().startswith("#EXTM3U"):
                              epg_line = s
                              break

                  # Her kanal satırı için
                  for i in range(len(lines)):
                      line = lines[i].strip()

                      if line.upper().startswith("#EXTM3U"):
                          continue

                      if not line.startswith("#EXTINF"):
                          continue

                      display = extract_name(line)
                      match_categories = []

                      if take_all:
                          match_categories.append(category)
                      else:
                          for cat, kw_list in filters.items():
                              for kw in kw_list:
                                  if keyword_match(display, kw):
                                      match_categories.append(cat)
                                      break

                      if not match_categories:
                          continue

                      # Eski kategori etiketlerini sil
                      line = re.sub(r'group-title="[^"]*"', '', line)
                      line = re.sub(r'tvg-group="[^"]*"', '', line)

                      # Her kategori için ayrı satır üret
                      for cat in match_categories:
                          final_line = line.replace("#EXTINF:", f'#EXTINF: group-title="{cat}" ', 1)
                          combined += final_line + "\n"

                          # URL ekle
                          if i + 1 < len(lines):
                              url = lines[i + 1].strip()
                              if url and not url.startswith("#"):
                                  combined += url + "\n"

                  print(f"✅ {actual} işlendi.")

              except Exception as e:
                  print(f"⚠️ {actual} okunamadı: {e}")

          # Son output
          final_output = (epg_line + "\n" if epg_line else "#EXTM3U\n") + combined

          # Gist güncelle
          update_payload = {"files": {"favoritv": {"content": final_output}}}
          upd = requests.patch(gist_api, headers=headers, json=update_payload)

          if upd.status_code == 200:
              print("🎉 Gist başarıyla güncellendi.")
          else:
              print(f"❌ Gist güncellenemedi: {upd.status_code}\n{upd.text}")

          PYCODE
