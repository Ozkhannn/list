name: Günlük IPTV Güncelleme (favoritv Gist)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Update favoritv list
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PYCODE'
          import os, requests, re

          gist_id = os.environ.get("GIST_ID")
          github_token = os.environ.get("GITHUB_TOKEN")

          if not gist_id or not github_token:
              print("❌ GIST_ID veya GITHUB_TOKEN eksik.")
              raise SystemExit(1)

          headers = {"Authorization": f"token {github_token}"}
          gist_api = f"https://api.github.com/gists/{gist_id}"

          # Gist'i al
          resp = requests.get(gist_api, headers=headers)
          if resp.status_code != 200:
              print(f"❌ Gist alınamadı: {resp.status_code}")
              raise SystemExit(1)

          gist_data = resp.json()
          files = gist_data.get("files", {})

          if "links" not in files:
              print("❌ 'links' dosyası bulunamadı.")
              raise SystemExit(1)

          links_content = files["links"]["content"]
          all_links = [line.strip() for line in links_content.splitlines() if line.strip()]
          print(f"🔗 {len(all_links)} bağlantı bulundu.")

          # filter.txt oku
          try:
              with open("filter.txt", "r", encoding="utf-8") as f:
                  favorite_channels = [line.strip() for line in f if line.strip()]
              print(f"🎯 {len(favorite_channels)} filtre yüklendi.")
          except Exception as e:
              print(f"⚠️ filter.txt okunamadı: {e}")
              favorite_channels = []

          combined = ""
          epg_line = None

          def extract_display_name(extinf_line):
              parts = extinf_line.split(',', 1)
              return parts[1].strip() if len(parts) == 2 else ""

          def match_channel(display_name, filter_list):
              dn = display_name.lower()
              for f in filter_list:
                  word = f.lower()
                  # kelime içinde değil, ayrı kelime olarak
                  if re.search(rf'\b{re.escape(word)}\b', dn):
                      return True
              return False

          for link in all_links:
              parts = [p for p in link.split('#') if p]
              category, take_all, actual_link = None, False, None

              if len(parts) == 3:  # kategori#all#URL
                  category = parts[0]
                  take_all = parts[1].lower() == "all"
                  actual_link = parts[2]
              elif len(parts) == 2:  # kategori#URL
                  category, actual_link = parts
              else:
                  actual_link = link

              if not actual_link.startswith("http"):
                  print(f"⚠️ Geçersiz URL atlandı: {actual_link}")
                  continue

              try:
                  r = requests.get(actual_link, timeout=60)
                  if r.status_code != 200:
                      print(f"⚠️ {actual_link} hata: {r.status_code}")
                      continue

                  lines = r.text.splitlines()
                  for i, line in enumerate(lines):
                      line = line.strip()
                      if not line:
                          continue

                      # EPG satırı koru
                      if line.startswith("#EXTM3U") and "url-tvg" in line:
                          epg_line = line
                          continue

                      if line.startswith("#EXTINF"):
                          name = extract_display_name(line)
                          if not (take_all or match_channel(name, favorite_channels)):
                              continue

                          # Mevcut kategori etiketlerini sil
                          line = re.sub(r'group-title="[^"]*"', '', line)
                          line = re.sub(r'tvg-group="[^"]*"', '', line)

                          # Yeni kategori ekle
                          if category:
                              line = line.replace("#EXTINF:", f'#EXTINF: group-title="{category}" ', 1)

                          combined += line + "\n"

                          # Altındaki URL'yi ekle
                          if i + 1 < len(lines):
                              next_line = lines[i + 1].strip()
                              if next_line and not next_line.startswith("#"):
                                  combined += next_line + "\n"

                  print(f"✅ {actual_link} işlendi. ({'ALL' if take_all else 'Filtreli'})")

              except Exception as e:
                  print(f"⚠️ {actual_link} indirilemedi: {e}")

          # EPG varsa başa ekle
          final_output = "#EXTM3U\n"
          if epg_line:
              final_output += epg_line + "\n"
          final_output += combined

          # Gist güncelle
          update_payload = {"files": {"favoritv": {"content": final_output}}}
          update_resp = requests.patch(gist_api, headers=headers, json=update_payload)

          if update_resp.status_code == 200:
              print("🎉 favoritv listesi başarıyla güncellendi.")
          else:
              print(f"❌ Gist güncellenemedi: {update_resp.status_code}, {update_resp.text}")
          PYCODE
