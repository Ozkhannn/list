name: Günlük IPTV Güncelleme 1.0 (favoritv)

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerekli paketler
        run: |
          pip install requests

      - name: IPTV listesini güncelle
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python <<'PYCODE'
          import os, requests, re

          gist_id = os.environ.get("GIST_ID")
          github_token = os.environ.get("GITHUB_TOKEN")

          headers = {"Authorization": f"token {github_token}"}
          gist_api = f"https://api.github.com/gists/{gist_id}"

          # --- GIST AL ---
          resp = requests.get(gist_api, headers=headers)
          gist_data = resp.json()
          links_file = gist_data["files"].get("links")

          if not links_file:
              print("❌ 'links' dosyası bulunamadı.")
              raise SystemExit(1)

          all_links = [l.strip() for l in links_file["content"].splitlines() if l.strip()]
          print(f"🔗 {len(all_links)} bağlantı bulundu.")

          # --- FILTER.TXT OKU ---
          filters = {}
          category_order = []
          with open("filter.txt", "r", encoding="utf-8") as f:
              current_category = None
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("[") and line.endswith("]"):
                      current_category = line[1:-1]
                      filters[current_category] = []
                      category_order.append(current_category)
                  else:
                      filters[current_category] += [
                          x.strip() for x in line.split(",") if x.strip()
                      ]

          # --- YARDIMCI FONKSİYONLAR ---
          def extract_name(extinf):
              parts = extinf.split(",", 1)
              return parts[1].lower() if len(parts) == 2 else ""

          def keyword_match(display_name, keyword):
              # REGEX GÜNCELLEMESİ: Kelimeyi isim içinde esnekçe arar
              pattern = re.compile(re.escape(keyword.lower()))
              return bool(pattern.search(display_name))

          # --- BAŞLANGIÇ ---
          # Kanalları kategorilerine göre depolamak için liste (Blok sıralama için)
          categorized_contents = {cat: [] for cat in category_order}
          raw_content = "" 
          epg_line = None

          for idx, link in enumerate(all_links):
              raw_mode = False
              if link.lower().startswith("all#"):
                  raw_mode = True
                  actual = link[4:]
              else:
                  actual = link

              if not actual.startswith("http"):
                  continue

              try:
                  r = requests.get(actual, timeout=60)
                  r.encoding = 'utf-8' # Karakter sorunu yaşamamak için
                  lines = r.text.splitlines()

                  # EPG (sadece ilk listeden veya bulana kadar)
                  if epg_line is None:
                      for l in lines:
                          if l.strip().upper().startswith("#EXTM3U"):
                              epg_line = l.strip()
                              break

                  # --- LİSTE TARAMA ---
                  i = 0
                  while i < len(lines):
                      line = lines[i].strip()

                      if not line.startswith("#EXTINF"):
                          i += 1
                          continue

                      # 🔥 RAW MODE → Direkt ham depoya
                      if raw_mode:
                          if i + 1 < len(lines):
                              url = lines[i + 1].strip()
                              if url and not url.startswith("#"):
                                  raw_content += line + "\n" + url + "\n"
                          i += 1
                          continue

                      # 🔍 FILTER MODE → Kategorilere ayırarak havuzda biriktir
                      display = extract_name(line)
                      found_match = False
                      for cat in category_order:
                          for kw in filters[cat]:
                              if keyword_match(display, kw):
                                  clean = re.sub(r'(group-title|tvg-group)="[^"]*"', '', line)
                                  final = clean.replace(
                                      "#EXTINF:",
                                      f'#EXTINF: group-title="{cat}" ',
                                      1
                                  )
                                  
                                  if i + 1 < len(lines):
                                      url = lines[i + 1].strip()
                                      if url and not url.startswith("#"):
                                          # Burası önemli: Listeye ekliyoruz, metne değil
                                          categorized_contents[cat].append(final + "\n" + url)
                                  
                                  found_match = True
                                  break
                          if found_match: break
                      i += 1

                  print(f"✅ {actual} işlendi.")

              except Exception as e:
                  print(f"⚠️ {actual} okunamadı: {e}")

          # --- SIRALI BİRLEŞTİRME (KATEGORİ BLOKLARI) ---
          final_output = (epg_line + "\n" if epg_line else "#EXTM3U\n")
          
          # 1. Önce all# ile gelen ham kanallar (Başa)
          if raw_content:
              final_output += raw_content.strip() + "\n"

          # 2. Sonra filter.txt'deki sıraya göre BLOK BLOK ekleme
          for cat in category_order:
              if categorized_contents[cat]:
                  # O kategoriye ait tüm linklerden gelen kanalları tek seferde ekler
                  final_output += "\n".join(categorized_contents[cat]) + "\n"

          # --- GIST GÜNCELLE ---
          payload = {"files": {"favoritv": {"content": final_output}}}
          upd = requests.patch(gist_api, headers=headers, json=payload)

          if upd.status_code == 200:
              print("🎉 Gist güncellendi. Sıralama: RAW -> Kategori Blokları")
          else:
              print(f"❌ Gist güncellenemedi: {upd.status_code}")
          PYCODE
