name: Günlük IPTV Güncelleme (favoritv)

on:
  schedule:
    [- cron: "0 3 * * *"]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerekli paketler
        run: |
          pip install requests

      - name: IPTV listesini güncelle
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python <<'PYCODE'
          import os, requests, re

          gist_id = os.environ.get("GIST_ID")
          github_token = os.environ.get("GITHUB_TOKEN")

          headers = {"Authorization": f"token {github_token}"}
          gist_api = f"https://api.github.com/gists/{gist_id}"

          # --- GIST AL ---
          resp = requests.get(gist_api, headers=headers)
          gist_data = resp.json()
          links_file = gist_data["files"].get("links")

          if not links_file:
              print("❌ 'links' dosyası bulunamadı.")
              raise SystemExit(1)

          all_links = [l.strip() for l in links_file["content"].splitlines() if l.strip()]
          print(f"🔗 {len(all_links)} bağlantı bulundu.")

          # --- FILTER.TXT OKU ---
          filters = {}
          with open("filter.txt", "r", encoding="utf-8") as f:
              current_category = None
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  if line.startswith("[") and line.endswith("]"):
                      current_category = line[1:-1]
                      filters[current_category] = []
                  else:
                      filters[current_category] += [
                          x.strip() for x in line.split(",") if x.strip()
                      ]

          print(f"📁 {len(filters)} kategori yüklendi.")

          # --- YARDIMCI FONKSİYONLAR ---
          def extract_name(extinf):
              parts = extinf.split(",", 1)
              return parts[1].lower() if len(parts) == 2 else ""

          def keyword_match(display_name, keyword):
              cleaned = re.sub(r'[^a-z0-9çğıöşü\s]', ' ', display_name)
              cleaned = re.sub(r'\s+', ' ', cleaned).strip()
              return keyword.lower() in cleaned.split()

          # --- BAŞLANGIÇ ---
          epg_line = None
          combined = ""

          for idx, link in enumerate(all_links):

              raw_mode = False

              if link.lower().startswith("all#"):
                  raw_mode = True
                  actual = link[4:]
              else:
                  actual = link

              if not actual.startswith("http"):
                  continue

              try:
                  r = requests.get(actual, timeout=60)
                  lines = r.text.splitlines()

                  # EPG (sadece ilk listeden)
                  if idx == 0 and epg_line is None:
                      for l in lines:
                          if l.strip().upper().startswith("#EXTM3U"):
                              epg_line = l.strip()
                              break

                  # 🔥 RAW MODE → olduğu gibi al
                  if raw_mode:
                      for l in lines:
                          s = l.strip()
                          if s.upper().startswith("#EXTM3U"):
                              continue
                          combined += s + "\n"

                      print(f"✅ {actual} (ALL) eklendi.")
                      continue

                  # 🔍 FILTER MODE
                  i = 0
                  while i < len(lines):
                      line = lines[i].strip()

                      if not line.startswith("#EXTINF"):
                          i += 1
                          continue

                      display = extract_name(line)
                      matched = []

                      for cat, kws in filters.items():
                          for kw in kws:
                              if keyword_match(display, kw):
                                  matched.append(cat)
                                  break

                      if matched:
                          clean = re.sub(r'group-title="[^"]*"', '', line)
                          clean = re.sub(r'tvg-group="[^"]*"', '', clean)

                          for cat in matched:
                              final = clean.replace(
                                  "#EXTINF:",
                                  f'#EXTINF: group-title="{cat}" ',
                                  1
                              )
                              combined += final + "\n"

                              if i + 1 < len(lines):
                                  url = lines[i + 1].strip()
                                  if url and not url.startswith("#"):
                                      combined += url + "\n"

                      i += 1

                  print(f"✅ {actual} işlendi.")

              except Exception as e:
                  print(f"⚠️ {actual} okunamadı: {e}")

          # --- ÇIKTI ---
          final_output = (epg_line + "\n" if epg_line else "#EXTM3U\n") + combined

          # --- GIST GÜNCELLE ---
          payload = {"files": {"favoritv": {"content": final_output}}}
          upd = requests.patch(gist_api, headers=headers, json=payload)

          if upd.status_code == 200:
              print("🎉 Gist başarıyla güncellendi.")
          else:
              print(f"❌ Gist güncellenemedi: {upd.status_code}")
          PYCODE
